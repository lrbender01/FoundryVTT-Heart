<!-- A real <form> (2026-09-29): without one, FormApplication had nothing to
     submit and knack edits were lost. Changes apply on Save. -->
<!-- Titled container (2026-09-30, Luke): the same title plate, glyph, and
     small column heads as the character sheet's Skills & Domains tab. -->
<form class="domains-manager" autocomplete="off">
  <div class="character-tab-container trait-edit-container">
    <div class="container-title"><span class="title-glyph">{{{heartGlyph "section" "domains"}}}</span>{{localizeHeart "domain" "label-multiple"}}</div>
    <div class="container-content">
    <div class="section domains grid-2 auto-first-col">
      <span class="trait-edit-head">{{localizeHeart "domain" "label-multiple"}}</span>
      <span class="trait-edit-head">{{localizeHeart "domain" "knack" "label-multiple"}}</span>
      {{#each domains as |domain name|}}
      <div class="domain-edit-row {{#if domain.value}}selected{{else}}unselected{{/if}}" data-tooltip="{{heartTip 'domain' name}}">
        <input type="checkbox" name="system.domains.{{name}}.value" {{checked domain.value}} />
        <span class="trait-glyph">{{{heartGlyph "domain" name}}}</span>
        <span class="domain-name">{{localizeHeart "domain" name}}</span>
      </div>
      <textarea class="knack-input" name="system.domains.{{name}}.knack" rows="1" {{#unless domain.value}}disabled{{/unless}}>{{domain.knack}}</textarea>
      {{/each}}
    </div>
    </div>
  </div>
    <footer class="manager-buttons">
      <button type="button" data-action="cancel"><span class="fas fa-times"></span> {{localizeHeart "cancel"}}</button>
      <button type="button" data-action="save"><span class="fas fa-save"></span> {{localizeHeart "save"}}</button>
    </footer>
</form>
