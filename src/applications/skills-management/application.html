<!-- A real <form> (2026-09-29): without one, FormApplication had nothing to
     submit and knack edits were lost. Changes apply on Save. -->
<form class="skills-manager" autocomplete="off">
    <div class="section skills grid-2 auto-first-col">
      <h3 class="center">{{localizeHeart "skill" "label-multiple"}}</h3>
      <h3 class="faded">{{localizeHeart "skill" "knack" "label-multiple"}}</h3>
      {{#each skills as |skill name|}}
      <div class="skill-edit-row {{#if skill.value}}selected{{else}}unselected{{/if}}">
        <input type="checkbox" name="system.skills.{{name}}.value" {{checked skill.value}} />
        <span class="trait-glyph">{{{heartGlyph "skill" name}}}</span>
        <span class="skill-name">{{localizeHeart "skill" name}}</span>
      </div>
      <textarea class="knack-input" name="system.skills.{{name}}.knack" rows="1" {{#unless skill.value}}disabled{{/unless}}>{{skill.knack}}</textarea>
      {{/each}}
    </div>
    <footer class="manager-buttons">
      <button type="button" data-action="cancel"><span class="fas fa-times"></span> {{localizeHeart "cancel"}}</button>
      <button type="button" data-action="save"><span class="fas fa-save"></span> {{localizeHeart "save"}}</button>
    </footer>
</form>
