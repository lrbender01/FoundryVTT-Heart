<li class="directory-item document {{@root.documentCls}} flexrow" data-entry-id="{{this._id}}" data-document-id="{{this._id}}">
    {{#if this.thumb}}
    <img class="thumbnail" title="{{localizeHeart this.name}}" alt="{{localizeHeart this.name}}" data-src="{{this.thumb}}"/>
    {{else if this.img}}
    <img class="thumbnail" title="{{localizeHeart this.name}}" alt="{{localizeHeart this.name}}" data-src="{{this.img}}"/>
    {{/if}}
    <h4 class="entry-name document-name"><a>{{localizeHeart this.name}}</a></h4>
</li>
